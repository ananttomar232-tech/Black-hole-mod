name: Build Living Black Hole

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read mod version
        run: echo "MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')" >> "$GITHUB_ENV"

      - name: Build mod jar
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Verify jar contents
        run: |
          ls -la build/libs
          JAR=$(ls build/libs/livingblackhole-*.jar | grep -v -E 'sources|slim' | head -n1)
          echo "JAR=$JAR" >> "$GITHUB_ENV"
          unzip -l "$JAR" | grep -E 'mods.toml|livingblackhole.mixins.json|livingblackhole.refmap.json|LivingBlackHole.class'
          unzip -p "$JAR" META-INF/MANIFEST.MF

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: LivingBlackHole-${{ env.MOD_VERSION }}-forge-1.20.1
          path: ${{ env.JAR }}

      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${MOD_VERSION}"
          OUT="LivingBlackHole-${MOD_VERSION}-forge-1.20.1.jar"
          cp "$JAR" "$OUT"
          gh release delete "$TAG" --cleanup-tag --yes || true
          git push --delete origin "$TAG" 2>/dev/null || true
          gh release create "$TAG" "$OUT" \
            --target "$GITHUB_SHA" \
            --title "Living Black Hole ${MOD_VERSION} (Forge 1.20.1)" \
            --notes "Automated build of commit ${GITHUB_SHA} from branch ${GITHUB_REF_NAME}. Drop ${OUT} into your .minecraft/mods folder (Forge 1.20.1, 47.x)." \
            --latest
